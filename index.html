<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&display=swap');

:root{--bg:#160a12;--panel:#251923;--ruby:#ff315b;--ruby-dark:#a90f37;--muted:#b3a0ae}

*{box-sizing:border-box}

body{margin:0;color:#fff;font-family:Inter,Arial,sans-serif;background:radial-gradient(ellipse at 10% 15%,#80132d55,transparent 35%),radial-gradient(ellipse at 90% 45%,#70132b55,transparent 35%),linear-gradient(145deg,#10080e,#310d1d 55%,#130910);min-height:100vh}

body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(135deg,transparent 49.5%,#ffffff09 50%,transparent 50.5%),linear-gradient(45deg,transparent 49.5%,#ffffff08 50%,transparent 50.5%);background-size:64px 64px}

button,input{font:inherit}

button{color:inherit;border:0;cursor:pointer}

.app{max-width:520px;margin:auto;min-height:100vh;padding:12px 14px 105px}

.topline{height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:12px}

.logo-btn{grid-column:2;width:126px;height:42px;background:transparent;padding:0}

.logo-btn svg{width:100%;height:100%}

.usercard{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #ffffff20;border-radius:21px;background:#211922dc;backdrop-filter:blur(15px)}

.avatar{width:51px;height:51px;flex-shrink:0;border-radius:16px;background:linear-gradient(145deg,#a61740,#ff456b);display:grid;place-items:center;overflow:hidden;font-size:27px}

.avatar img{width:100%;height:100%;object-fit:cover}

.userinfo{flex:1;min-width:0}

.username{font-size:12px;color:#c8b7c3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.balance{font-size:25px;font-weight:900;margin-top:3px}

.ruby{color:var(--ruby)}

.quick button{width:43px;height:43px;border-radius:14px;background:var(--ruby);font-size:27px;font-weight:500}

.banner{position:relative;overflow:hidden;margin:16px 0 22px;padding:19px;border:1px solid #ff456b55;border-radius:22px;background:linear-gradient(110deg,#360c1e,#791633,#3b0c21)}

.banner:after{content:"♦";position:absolute;right:10px;top:-15px;font-size:100px;color:#ffffff16}

.eyebrow{font-size:10px;letter-spacing:1.5px;color:#ffd5df;font-weight:800}

.banner h2{position:relative;z-index:1;margin:10px 0;font-size:23px;font-weight:900}

.banner p{position:relative;z-index:1;margin:0;color:#d7b5c4;font-size:12px}

.dots{display:flex;gap:5px;margin-top:13px}

.dots i{width:5px;height:5px;border-radius:5px;background:#ffffff55}

.dots i.on{width:18px;background:white}

.sectionhead{font-size:17px;font-weight:900;margin:18px 0 13px}

.sectionhead span{color:#ff6481}

.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.game{height:145px;border-radius:22px;position:relative;overflow:hidden;text-align:left;padding:0}

.game.wide{grid-column:1/-1;height:105px}

.g1{background:linear-gradient(130deg,#087d68,#26db91)}

.g2{background:linear-gradient(130deg,#183252,#1685ef)}

.g3{background:linear-gradient(110deg,#ff7625,#e21e91)}

.g4{background:linear-gradient(130deg,#0875f5,#00bde0)}

.g5{background:linear-gradient(130deg,#1462e9,#37a9ff)}

.pill{position:absolute;top:10px;left:10px;background:#0003;padding:6px 9px;border-radius:30px;font-size:9px;font-weight:900}

.decor{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:69px;color:#ffffff8a}

.game-name{position:absolute;bottom:10px;left:10px;background:#10131a66;padding:7px 10px;border-radius:11px;font-size:18px;font-weight:900}

.bottomnav{position:fixed;z-index:10;bottom:calc(9px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;background:#29212bdc;border:1px solid #ffffff25;border-radius:23px;box-shadow:0 12px 40px #0008;backdrop-filter:blur(24px)}

.navitem{height:47px;background:transparent;color:#c4b5c4;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:20px}

.navitem.active{color:#ff6481;background:#ff4c731c}

.navlabel{font-size:9px;font-weight:800}

.navitem.central{height:56px;width:56px;justify-self:center;margin-top:-17px;border-radius:19px;background:linear-gradient(145deg,#ff6686,#d91f4b);border:1px solid #ffffff55;box-shadow:0 8px 24px #e3345b66;font-size:30px}

.pagehead{display:flex;align-items:center;gap:11px;margin:8px 0 18px}

.back{width:40px;height:40px;border-radius:13px;background:#30232e;border:1px solid #ffffff1c;font-size:25px}

.pagehead h1{font-size:23px;margin:0;font-weight:900}

.sub{color:var(--muted);font-size:12px;margin-top:4px}

.panel{padding:15px;margin-bottom:12px;background:#261c26df;border:1px solid #ffffff1c;border-radius:19px}

.panel h3{margin:0 0 12px;font-size:15px}

.small{font-size:11px;line-height:1.55;color:var(--muted)}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.muted{color:var(--muted)}

.btn{padding:13px 15px;border-radius:13px;background:var(--ruby);font-weight:800}

.btn.secondary{background:#342631;border:1px solid #ffffff1b}

.btn:disabled{opacity:.5;cursor:not-allowed}

.input{width:100%;padding:13px;border-radius:12px;border:1px solid #563447;background:#180e17;color:#fff;outline:none}

.input:focus{border-color:var(--ruby)}

.betrow{display:flex;gap:7px;flex-wrap:wrap}

.chip{padding:10px 12px;border-radius:11px;background:#382737;border:1px solid #4b3748}

.chip.sel{background:#71203b;border-color:#ff456b}

.empty{text-align:center;color:var(--muted);padding:18px 8px}

.listrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #493544}

.listrow:last-child{border:0}

.balancebig{font-size:30px;font-weight:900}

.roulettewheel{width:210px;height:210px;margin:18px auto;border:8px solid #453241;border-radius:50%;background:repeating-conic-gradient(#e3345b 0 30deg,#f5f2ed 30deg 60deg,#242833 60deg 90deg);display:grid;place-items:center;box-shadow:0 0 0 4px #171018}

.wheelcenter{width:65px;height:65px;border-radius:50%;background:#17121a;border:5px solid #65515f;display:grid;place-items:center;font-weight:900}

@keyframes spin{to{transform:rotate(1440deg)}}

.roulettewheel.spin{animation:spin 2.4s cubic-bezier(.12,.7,.18,1)}

.grid25{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:15px 0}

.cell{aspect-ratio:1;border-radius:11px;background:linear-gradient(145deg,#382838,#1c171e);border:1px solid #493544;font-size:22px}

.cell.open{background:#0c745e}.cell.mine{background:#84213a}

.ladder{display:flex;flex-direction:column-reverse;gap:7px;margin:16px 0}

.level{padding:12px;border-radius:11px;background:#302430;border:1px solid #493544;display:flex;justify-content:space-between}

.level.current{background:#642039;border-color:#ed456a}

.bonus-form{margin-top:5px;margin-bottom:17px;padding:15px;border:1px solid #ffffff1c;border-radius:18px;background:#261822e8}

.bonus-form h3{font-size:16px;margin:0 0 7px}

.bonus-form p{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 13px}

.promo-line{display:flex;gap:8px}

.promo-input{min-width:0;flex:1;padding:13px 12px;border-radius:12px;border:1px solid #714054;background:#170c15;color:white;font-weight:800;text-transform:uppercase;outline:none}

.promo-input:focus{border-color:#ff456b}

.promo-button{padding:12px 14px;border-radius:12px;background:linear-gradient(110deg,#ff315b,#d91e49);font-size:12px;font-weight:900;white-space:nowrap}

@media(max-width:390px){.app{padding-left:11px;padding-right:11px}.promo-line{flex-direction:column}.promo-button{width:100%}}

/* ===== Рулетка ===== */

.rw{background:#1a212d;border:5px solid #2a7a5e;border-radius:24px;overflow:hidden;margin-bottom:12px;font-family:Unbounded,Inter,sans-serif;--rw-red:#f43053;--rw-dark:#34495e;--rw-zero:#3cc59a}

.rw-wheel{position:relative;height:190px;overflow:hidden;background:#1a212d}

.rw-wheel svg{position:absolute;left:50%;top:-410px;width:600px;height:600px;margin-left:-300px;transform-origin:50% 50%}

.rw svg text{font-family:Unbounded,Inter,sans-serif}

.rw-pointer{position:absolute;left:50%;top:84px;width:34px;height:48px;margin-left:-17px;background:linear-gradient(90deg,#fff 50%,#d7d9de 50%);clip-path:polygon(0 0,100% 0,50% 100%)}

.rw-body{padding:0 12px 14px}

.rw-last{display:flex;gap:5px;flex-wrap:wrap;min-height:26px;align-items:center;margin:10px 0 6px;font-size:11px;color:#7f8b9c}

.rw-pill{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;font-size:11px;font-weight:800;color:#fff;font-style:normal}

.rw-pill.red{background:var(--rw-red)}.rw-pill.black{background:var(--rw-dark)}.rw-pill.green{background:var(--rw-zero)}

.rw-msg{font-size:12px;color:#b8c2d0;min-height:30px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:Inter,sans-serif}

.rw-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 4px 12px;scrollbar-width:none}

.rw-chips::-webkit-scrollbar{display:none}

.rw-chipbtn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--c);border:3px dashed #ffffffcc;box-shadow:inset 0 0 0 3px var(--c),0 3px 8px #0006;color:#fff;font:800 11px Unbounded,Inter,sans-serif;transition:transform .15s}

.rw-chipbtn.sel{transform:translateY(-4px) scale(1.1);outline:2px solid #fff;outline-offset:2px}

.rw-sum{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#aab4c3;margin:2px 0 8px}.rw-sum b{color:#fff}

.rw-table{display:grid;grid-template-columns:repeat(3,1fr) 1fr 1fr;grid-template-rows:repeat(13,40px) 36px;gap:6px}

.rw-cell{position:relative;min-width:0;padding:0;border:1px solid transparent;border-radius:8px;color:#fff;font:800 15px Unbounded,Inter,sans-serif;display:grid;place-items:center}

.rw-cell:active{transform:scale(.96)}.rw-cell:disabled{opacity:.7}

.rw-cell.red{background:var(--rw-red)}.rw-cell.black{background:var(--rw-dark)}.rw-cell.zero{background:var(--rw-zero)}

.rw-cell.out{background:#141b25;border-color:#2a3444;font-size:13px}

.rw-cell.v{font-size:14px}.rw-cell.v span{writing-mode:vertical-rl;transform:rotate(180deg)}

.rw-cell.win{box-shadow:0 0 0 2px #fff;animation:rwpulse .9s ease 3}

@keyframes rwpulse{50%{filter:brightness(1.7)}}

.rw-chip{position:absolute;z-index:2;top:-7px;right:-5px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:#fff;color:#111;font:800 9px Unbounded,Inter,sans-serif;font-style:normal;display:grid;place-items:center;box-shadow:0 2px 6px #0008}

.rw-tools{grid-column:4/6;grid-row:1;display:flex;justify-content:flex-end;gap:8px}

.rw-tool{width:42px;padding:0;border-radius:9px;background:#141b25;border:1px solid #2f3b4c;color:#fff;display:grid;place-items:center}

.rw-tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.rw-actions{display:flex;gap:8px;margin-top:14px}.rw-actions .btn{flex:1}

.rw-note{font:400 10px/1.5 Inter,sans-serif;color:#7f8b9c;margin-top:12px}

/* ===== Уведомления ===== */

.toasts{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);width:min(488px,calc(100% - 24px));display:flex;flex-direction:column;gap:8px;pointer-events:none}

.ntoast{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;padding:14px 12px 17px 14px;border-radius:22px;border:1.5px solid var(--tcb);background:linear-gradient(110deg,#2b283b,#363350 60%,#2c2a40);box-shadow:0 14px 40px #000a;animation:ntin .28s cubic-bezier(.2,.9,.3,1.1)}

.nicon{flex:none;width:52px;height:52px;border-radius:16px;background:var(--tca);display:grid;place-items:center;color:var(--tc)}

.nicon svg{width:30px;height:30px}

.nbody{flex:1;min-width:0}

.ntitle{font-size:17px;font-weight:800;color:#fff;line-height:1.2}

.ntext{margin-top:3px;font-size:14px;line-height:1.35;color:#d9d4ef;overflow-wrap:anywhere}

.nclose{flex:none;align-self:flex-start;width:30px;height:30px;padding:0;border-radius:9px;background:transparent;color:#8d88ab;display:grid;place-items:center}

.nclose svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

.nbar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--tc);border-radius:0 4px 4px 0;transform-origin:left;animation:ntbar linear forwards}

@keyframes ntbar{to{transform:scaleX(0)}}

@keyframes ntin{from{opacity:0;transform:translateY(18px) scale(.96)}}


/* RUBIN ORIGINALS game updates */
.original-banner{position:relative;overflow:hidden;padding:15px 16px;margin:0 0 12px;border-radius:17px;border:1px solid #ff456b66;background:linear-gradient(110deg,#360c1e,#791633 58%,#3b0c21)}
.original-banner:after{content:'♦';position:absolute;right:12px;top:-15px;font-size:72px;color:#ffffff14}
.original-banner .eyebrow{color:#ffd5df}.original-banner strong{display:block;font-size:18px;margin-top:6px}.original-banner small{display:block;color:#d7b5c4;margin-top:5px;max-width:85%;line-height:1.45}
.stakebox{padding:14px;margin:0 0 12px;border-radius:16px;background:#211720;border:1px solid #ffffff1c}
.stakebox label{display:block;font-weight:800;font-size:13px;margin-bottom:9px}
.stakebox input{width:100%;min-width:0;padding:13px;border-radius:11px;border:1px solid #563447;background:#180e17;color:#fff;outline:none;font-weight:800}
.stakebox input:focus{border-color:var(--ruby)}
.stake-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:8px}
.stake-tools button{padding:10px 3px;border-radius:10px;background:#382737;border:1px solid #4b3748;font-size:12px;font-weight:900}
.stake-tools button.max{background:#71203b;border-color:#ff456b}
.stake-tools button:disabled{opacity:.45}
.keno-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:14px 0}
.keno-number{min-width:0;aspect-ratio:1;border-radius:9px;background:linear-gradient(145deg,#382838,#1c171e);border:1px solid #493544;color:#d8c8d4;font-weight:900;font-size:13px}
.keno-number.selected{background:linear-gradient(145deg,#a71942,#67132e);border-color:#ff6686;color:#fff;box-shadow:0 0 0 1px #ff456b55}
.keno-number.drawn{background:#173f37;border-color:#28bd8d;color:#9bffdb}
.keno-number.selected.drawn{background:linear-gradient(145deg,#07885f,#07513e);border-color:#5af0b4}
.game-actions{display:flex;gap:8px}.game-actions>*{flex:1;min-width:0}
.payout-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.payout-table th,.payout-table td{padding:8px 6px;border-bottom:1px solid #ffffff15;text-align:center}.payout-table th{color:#d7b5c4;font-weight:800}.payout-table td:first-child,.payout-table th:first-child{text-align:left}
.coin-area{padding:14px 0;text-align:center}.coin-3d{width:150px;height:150px;margin:5px auto 17px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff2a2,#f3b52e 48%,#9c5a16 70%,#ffd86d 75%);border:7px solid #eab43c;box-shadow:0 0 0 5px #4b2b24,0 10px 0 #4b2b24,0 18px 35px #0008;color:#7c4312;font-size:42px;font-weight:900;transform-style:preserve-3d}
.coin-3d.flip{animation:coinflip .65s ease-in-out 3}
@keyframes coinflip{0%{transform:rotateY(0) rotateZ(0)}50%{transform:rotateY(900deg) rotateZ(12deg) scale(1.05)}100%{transform:rotateY(1800deg) rotateZ(0)}}
.coin-picks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.coin-picks button{padding:16px 8px;border-radius:13px;background:#382737;border:1px solid #4b3748;font-weight:900}.coin-picks button.sel{background:#71203b;border-color:#ff456b}
.ladder-board{display:flex;flex-direction:column-reverse;gap:7px;margin:15px 0}.ladder-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:7px;align-items:center;padding:7px;border:1px solid #ffffff12;border-radius:12px;background:#201720}.ladder-row.current{border-color:#ed456a;background:#3b1c2d}.ladder-meta{font-size:10px;color:var(--muted);line-height:1.5}.ladder-meta b{display:block;color:#fff;font-size:12px}.ladder-cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.ladder-cells button{height:42px;min-width:0;border-radius:9px;background:#382838;border:1px solid #493544;font-size:17px;font-weight:900}.ladder-cells button.safe{background:#0c745e;border-color:#27b990}.ladder-cells button.mine{background:#84213a;border-color:#ed456a}.ladder-cells button:disabled{opacity:1}
.difficulty-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0 14px}.difficulty-row button{padding:11px 4px;border-radius:10px;background:#382737;border:1px solid #4b3748;font-size:12px;font-weight:800}.difficulty-row button.sel{background:#71203b;border-color:#ff456b}
@media(max-width:360px){.keno-grid{gap:4px}.keno-number{font-size:11px}.stake-tools button{font-size:10px}.ladder-row{grid-template-columns:61px minmax(0,1fr);padding:5px}.ladder-cells button{height:38px}}

</style>

<script type="text/babel">

const {useState,useEffect}=React;

const fmt=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2});

/* ===== Уведомления ===== */

const TOAST_MS=4200;

const TOAST={

 info:{c:'#f5c542',title:'Внимание',icon:'info'},

 error:{c:'#ff5268',title:'Ошибка',icon:'alert'},

 success:{c:'#38d996',title:'Готово',icon:'check'},

 win:{c:'#38d996',title:'Выигрыш',icon:'gem'},

 lose:{c:'#ff5268',title:'Проигрыш',icon:'down'},

 bonus:{c:'#ff6481',title:'Бонус',icon:'gift'},

 deposit:{c:'#4aa3ff',title:'Пополнение',icon:'plus'},

 withdraw:{c:'#b57bff',title:'Вывод',icon:'up'}

};

const TOAST_GLYPH={

 info:<><path d="M12 11v6"/><circle cx="12" cy="7.6" r="1.3" fill="#1d1a2b" stroke="none"/></>,

 alert:<><path d="M12 7v6.2"/><circle cx="12" cy="16.7" r="1.3" fill="#1d1a2b" stroke="none"/></>,

 check:<path d="M7.5 12.5l3 3 6-6.5"/>,

 gem:<path d="M9 8h6l3 3.5-6 6.5-6-6.5z" fill="#1d1a2b" stroke="none"/>,

 down:<path d="M12 7v9M8 12.5l4 4 4-4"/>,

 up:<path d="M12 17V8M8 11.5l4-4 4 4"/>,

 plus:<path d="M12 7v10M7 12h10"/>,

 gift:<path d="M7 11h10v6H7zM6.5 8.5h11V11h-11zM12 8.5V17"/>

};

function ToastIcon({name}){

 return <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><g fill="none" stroke="#1d1a2b" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">{TOAST_GLYPH[name]}</g></svg>;

}

function Toasts({items,onClose}){

 return <div className="toasts">{items.map(t=>{

  const s=TOAST[t.type]||TOAST.info;

  return <div key={t.id} className="ntoast" role="status" style={{'--tc':s.c,'--tcb':s.c+'8c','--tca':s.c+'40'}}>

   <div className="nicon"><ToastIcon name={s.icon}/></div>

   <div className="nbody"><div className="ntitle">{t.title}</div><div className="ntext">{t.text}</div></div>

   <button className="nclose" aria-label="Закрыть" onClick={()=>onClose(t.id)}><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

   <i className="nbar" style={{animationDuration:TOAST_MS+'ms'}}/>

  </div>})}</div>;

}

/* ===== Рулетка ===== */

const RW_RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

const RW_ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

const RW_SEG=360/37, RW_MAX=50000;

const RW_CHIPS=[1,5,10,50,100,500,1000,5000,10000,50000];

const RW_CHIP_COLORS=['#9aa4b2','#3b82f6','#22c55e','#f59e0b','#ef4444','#a855f7','#eab308','#ec4899','#14b8a6','#ff315b'];

const rwShort=n=>n>=1000?(+(n/1000).toFixed(1))+'K':String(n);

const rwColor=n=>n===0?'green':RW_RED.has(n)?'red':'black';

const rwName={green:'зелёное',red:'красное',black:'чёрное'};

const rwFill={green:'#3cc59a',red:'#f43053',black:'#34495e'};

const rwMult=(k,n)=>{

 if(k[0]==='n')return +k.slice(1)===n?36:0;

 if(n===0)return 0;

 switch(k){

  case 'd1':return n<=12?3:0; case 'd2':return n>12&&n<=24?3:0; case 'd3':return n>24?3:0;

  case 'c1':return n%3===1?3:0; case 'c2':return n%3===2?3:0; case 'c3':return n%3===0?3:0;

  case 'low':return n<=18?2:0; case 'high':return n>=19?2:0;

  case 'even':return n%2===0?2:0; case 'odd':return n%2===1?2:0;

  case 'red':return RW_RED.has(n)?2:0; case 'black':return RW_RED.has(n)?0:2;

 }

 return 0;

};

const rwWedge=i=>{

 const a0=(i-.5)*RW_SEG*Math.PI/180,a1=(i+.5)*RW_SEG*Math.PI/180,Ro=300,Ri=228;

 const p=(a,r)=>[(r*Math.sin(a)).toFixed(2),(-r*Math.cos(a)).toFixed(2)];

 const [x0,y0]=p(a0,Ro),[x1,y1]=p(a1,Ro),[x2,y2]=p(a1,Ri),[x3,y3]=p(a0,Ri);

 return `M${x0} ${y0}A${Ro} ${Ro} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${Ri} ${Ri} 0 0 0 ${x3} ${y3}Z`;

};

function RouletteGame({balance,setBalance,notify,record,onRound}){

 const [bets,setBets]=useState({});

 const [stack,setStack]=useState([]);

 const [prev,setPrev]=useState(null);

 const [chip,setChip]=useState(10);

 const [spinning,setSpinning]=useState(false);

 const [rot,setRot]=useState(180);

 const [last,setLast]=useState([]);

 const [res,setRes]=useState(null);

 const total=Object.values(bets).reduce((a,b)=>a+b,0);

 const place=k=>{

  if(spinning)return;

  const cur=bets[k]||0,room=RW_MAX-cur;

  if(room<1){notify('Максимум 50 000 ♦ на одну ставку','error','Лимит ставки');return}

  const amt=Math.min(chip,room);

  if(amt>balance-total){notify('Недостаточно демо-рубинов для такой ставки','error','Недостаточно средств');return}

  setBets({...bets,[k]:cur+amt});setStack([...stack,[k,amt]]);

  window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('light');

 };

 const undo=()=>{

  if(spinning||!stack.length)return;

  const [k,a]=stack[stack.length-1],b={...bets};

  b[k]-=a;if(b[k]<=0)delete b[k];

  setBets(b);setStack(stack.slice(0,-1));

 };

 const clear=()=>{if(!spinning){setBets({});setStack([])}};

 const repeat=()=>{

  if(spinning||!prev)return;

  const sum=Object.values(prev).reduce((a,b)=>a+b,0);

  if(sum>balance){notify('Недостаточно демо-рубинов для повтора ставки','error','Недостаточно средств');return}

  setBets({...prev});setStack(Object.entries(prev));

 };

 const spin=()=>{

  if(spinning)return;

  if(!total){notify('Нажмите на поле стола, чтобы поставить фишку','info','Нет ставки');return}

  if(total>balance){notify('Недостаточно демо-рубинов для такой ставки','error','Недостаточно средств');return}

  const a=new Uint32Array(1);crypto.getRandomValues(a);

  const n=a[0]%37,i=RW_ORDER.indexOf(n);

  const want=(((180-i*RW_SEG+(Math.random()-.5)*RW_SEG*.7)%360)+360)%360;

  const placed={...bets},spent=total;

  setBalance(v=>v-spent);setSpinning(true);setRes(null);

  setRot(Math.floor(rot/360)*360+360*6+want);

  setTimeout(()=>{

   let payout=0;for(const k in placed)payout+=placed[k]*rwMult(k,n);

   if(payout)setBalance(v=>v+payout);

   setSpinning(false);setRes({n,payout,net:payout-spent});

   setLast(l=>[n,...l].slice(0,12));setPrev(placed);setBets({});setStack([]);onRound();

   record('Рулетка',n+' '+rwName[rwColor(n)],payout-spent);

   const net=payout-spent,nm=n+' · '+rwName[rwColor(n)];

   if(net>0)notify('Выпало '+nm+'. Выплата '+fmt(payout)+' ♦ (+'+fmt(net)+')','win');

   else if(net===0)notify('Выпало '+nm+'. Ставка возвращена','info','Ничья');

   else notify('Выпало '+nm+'. Потеряно '+fmt(-net)+' ♦'+(payout?' (выплата '+fmt(payout)+' ♦)':''),'lose');

  },5200);

 };

 const chipEl=k=>bets[k]?<i className="rw-chip">{rwShort(bets[k])}</i>:null;

 const cell=(k,cls,label,style)=><button key={k} disabled={spinning} className={'rw-cell '+cls+(res&&k==='n'+res.n?' win':'')} style={style} onClick={()=>place(k)}><span>{label}</span>{chipEl(k)}</button>;

 return <div className="rw">

  <div className="rw-wheel">

   <svg viewBox="-300 -300 600 600" style={{transform:`rotate(${rot}deg)`,transition:spinning?'transform 5s cubic-bezier(.12,.62,.1,1)':'none'}}>

    <circle r="230" fill="#151b25"/>

    {RW_ORDER.map((n,i)=><g key={n}>

     <path d={rwWedge(i)} fill={rwFill[rwColor(n)]} stroke="#1a212d" strokeWidth="2"/>

     <text transform={`rotate(${i*RW_SEG}) translate(0,-264) rotate(180)`} textAnchor="middle" dominantBaseline="central" fill="#fff" fontSize="21" fontWeight="800">{n}</text>

    </g>)}

   </svg>

   <div className="rw-pointer"/>

  </div>

  <div className="rw-body">

   <div className="rw-last">{last.length?last.map((n,i)=><i key={i} className={'rw-pill '+rwColor(n)}>{n}</i>):'Здесь появятся последние числа'}</div>

   <div className="rw-msg">{spinning?'Шарик в игре…':res?<>Выпало <i className={'rw-pill '+rwColor(res.n)}>{res.n}</i> {rwName[rwColor(res.n)]} · {res.net>=0?'+':''}{fmt(res.net)} ♦</>:'Выберите фишку и нажимайте на поле'}</div>

   <div className="rw-chips">{RW_CHIPS.map((c,i)=><button key={c} className={'rw-chipbtn'+(chip===c?' sel':'')} style={{'--c':RW_CHIP_COLORS[i]}} onClick={()=>setChip(c)}>{rwShort(c)}</button>)}</div>

   <div className="rw-sum"><span>Сумма ставки: <b>{fmt(total)} ♦</b></span><span>Баланс: <b>{fmt(balance)} ♦</b></span></div>

   <div className="rw-table">

    {cell('n0','zero','0',{gridColumn:'1 / 4',gridRow:1})}

    <div className="rw-tools">

     <button className="rw-tool" aria-label="Отменить" onClick={undo}><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>

     <button className="rw-tool" aria-label="Очистить" onClick={clear}><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>

    </div>

    {Array.from({length:36},(_,j)=>{const n=j+1;return cell('n'+n,rwColor(n),n,{gridColumn:(j%3)+1,gridRow:2+Math.floor(j/3)})})}

    {[1,2,3].map(c=>cell('c'+c,'out','2:1',{gridColumn:c,gridRow:14}))}

    {[['d1','1 - 12'],['d2','13 - 24'],['d3','25 - 36']].map(([k,l],i)=>cell(k,'out v',l,{gridColumn:4,gridRow:(2+i*4)+' / span 4'}))}

    {[['low','out','1 - 18'],['even','out','ЧЕТ'],['red','red',''],['black','black',''],['odd','out','НЕЧЕТ'],['high','out','19 - 36']].map(([k,cls,l],i)=>cell(k,cls,l,{gridColumn:5,gridRow:(2+i*2)+' / span 2'}))}

   </div>

   <div className="rw-actions">

    <button className="btn secondary" disabled={spinning||!prev} onClick={repeat}>Повторить</button>

    <button className="btn" disabled={spinning||!total} onClick={spin}>Крутить · {fmt(total)} ♦</button>

   </div>

   <div className="rw-note">Европейская рулетка, один ноль. Ставка на одну ячейку: 1–50 000 ♦. Выплаты: число ×36, дюжина и колонка ×3, чёт/нечет, цвет и 1–18 / 19–36 ×2; при выпадении 0 внешние ставки проигрывают. Демо-режим, фишки виртуальные.</div>

  </div>

 </div>;

}

 return <div className="stakebox">

  <input aria-label="Сумма ставки" type="number" inputMode="numeric" min="1" step="1" value={bet} disabled={disabled} onChange={e=>change(e.target.value)} />
  <div className="stake-tools">

 </div>;
}

 };

 function wheel(){

 function toggleKeno(n){

  setKenoSelected(old=>old.includes(n)?old.filter(x=>x!==n):(old.length<10?[...old,n]:old));
  setKenoDrawn([]);setKenoLast(null);
 }
 function autoKeno(){
  if(spinning)return;const pool=Array.from({length:40},(_,i)=>i+1);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  setKenoSelected(pool.slice(0,5));setKenoDrawn([]);setKenoLast(null);
 }
 function clearKeno(){if(spinning)return;setKenoSelected([]);setKenoDrawn([]);setKenoLast(null)}
 function playKeno(){
  if(spinning||kenoSelected.length<1||kenoSelected.length>10){notify('Выбери от 1 до 10 чисел','error');return}
  if(!charge())return;setSpinning(true);setKenoLast(null);
  const pool=Array.from({length:40},(_,i)=>i+1);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const drawn=pool.slice(0,10);const hits=kenoSelected.filter(n=>drawn.includes(n)).length;
  const payouts={1:[0,3.5],2:[0,1.2,5],3:[0,0,2,12],4:[0,0,1.5,4,20],5:[0,0,1,2,8,35],6:[0,0,.5,2,5,15,50],7:[0,0,.5,1.5,3,8,25,70],8:[0,0,0,1,2,5,15,40,100],9:[0,0,0,.5,1.5,3,8,20,60,150],10:[0,0,0,.5,1,2,5,12,35,90,250]};
  const mult=payouts[kenoSelected.length][hits]||0;const payout=Math.floor(bet*mult);
  setTimeout(()=>{setKenoDrawn(drawn);setKenoLast({hits,mult,payout,drawn:[...drawn].sort((a,b)=>a-b),picked:[...kenoSelected]});setSpinning(false);setRounds(v=>v+1);if(payout)setBalance(v=>v+payout);record('Кено',hits+' совпадений · ×'+mult,payout-bet);notify(hits+' совпадений · выплата '+fmt(payout)+' ♦',''+(payout>bet?'win':payout===bet?'info':'lose'));},1100);
 }

 function startMines(){
  if(mineStarted||!charge())return;
  const count=Math.max(2,Math.min(24,Math.floor(Number(mineCount)||2)));setMineCount(count);
  const mines=new Set();while(mines.size<count)mines.add(Math.floor(Math.random()*25));
  setMineBoard(Array.from({length:25},(_,i)=>({mine:mines.has(i),open:false})));
  setMineOver(false);setMineStarted(true);setMineSafe(0);setRounds(v=>v+1);
 }
 function openCell(i){
  if(!mineStarted||mineOver||mineBoard[i]?.open)return;
  const b=mineBoard.map((c,j)=>j===i?{...c,open:true}:c);setMineBoard(b);
  if(b[i].mine){
   setMineOver(true);setMineStarted(false);setMineBoard(b.map(c=>({...c,open:c.open||c.mine})));
   record('Мины','Мина',-bet);notify('Попалась мина. Потеряно '+fmt(bet)+' ♦','lose','Проигрыш');
  }else{
   const safe=mineSafe+1;setMineSafe(safe);
   if(safe>=25-mineCount){
    const mult=mineMultiplier(safe,mineCount);const win=Math.floor(bet*mult);
    setBalance(v=>v+win);setMineOver(true);setMineStarted(false);setMineBoard(b.map(c=>({...c,open:true})));
    record('Мины','Все рубины найдены · ×'+mult.toFixed(2),win-bet);notify('Все безопасные клетки открыты. Выплата '+fmt(win)+' ♦','win');
   }
  }
 }
 function mineMultiplier(safe,count){
  let m=1;for(let i=0;i<safe;i++)m*=((25-i)/(25-count-i));return Math.max(1,m*.96);
 }
 function cashMines(){
  if(!mineStarted||!mineSafe)return;
  const mult=mineMultiplier(mineSafe,mineCount),win=Math.floor(bet*mult);
  setBalance(v=>v+win);setMineStarted(false);setMineOver(true);setMineBoard(b=>b.map(c=>({...c,open:c.open||c.mine})));
  record('Мины','Забрал ×'+mult.toFixed(2),win-bet);notify('Вы забрали '+fmt(win)+' ♦ (×'+mult.toFixed(2)+')','win');
 }

 function ladderMultiplier(level){return Math.pow(({easy:1.18,medium:1.48,hard:1.9})[ladderDifficulty],level)}
 function startLadder(){
  if(ladderActive||!charge())return;
  const count=({easy:1,medium:2,hard:3})[ladderDifficulty];
  const rows=Array.from({length:8},()=>{const pool=[0,1,2,3].sort(()=>Math.random()-.5);return pool.slice(0,count)});
  setLadderMines(rows);setLadderChoices(Array(8).fill(null));setLadderLevel(0);setLadderOver(false);setLadderActive(true);setLadderMsg('Выбери одну из четырёх ячеек на первом уровне');setRounds(v=>v+1);
 }
 function climb(col){
  if(!ladderActive||ladderLevel>=8)return;
  const row=ladderLevel;const chosen=[...ladderChoices];chosen[row]=col;setLadderChoices(chosen);
  const n=row+1;const isMine=(ladderMines[row]||[]).includes(col);
  if(isMine){setLadderActive(false);setLadderOver(true);setLadderMsg('💣 Мина! Раунд проигран');record('Лестница','Мина на уровне '+n,-bet);notify('Вы попали на мину. Потеряно '+fmt(bet)+' ♦','lose');return}
  setLadderLevel(n);setLadderMsg('💎 Рубин найден · уровень '+n+' · ×'+ladderMultiplier(n).toFixed(2));
  if(n===8){const mult=ladderMultiplier(n),win=Math.floor(bet*mult);setBalance(v=>v+win);setLadderActive(false);setLadderOver(true);record('Лестница','Финиш ×'+mult.toFixed(2),win-bet);notify('Лестница пройдена! Выплата '+fmt(win)+' ♦','win')}
 }
 function cashLadder(){
  if(!ladderActive||!ladderLevel)return;
  const mult=ladderMultiplier(ladderLevel),win=Math.floor(bet*mult);
  setBalance(v=>v+win);setLadderActive(false);setLadderOver(true);setLadderMsg('Забрано '+fmt(win)+' ♦');
  record('Лестница','Забрал ×'+mult.toFixed(2),win-bet);notify('Вы забрали '+fmt(win)+' ♦ (×'+mult.toFixed(2)+')','win');
 }

   </div>

   <div className="banner">

    <div className="eyebrow">{banners[banner][0]}</div>

    <h2>{banners[banner][1]}</h2><p>{banners[banner][2]}</p>

    <div className="dots">{banners.map((_,i)=><i key={i} className={banner===i?'on':''}/>)}</div>

   </div>

   <div className="sectionhead"><span>✦</span> Игры <span style={{fontSize:10}}>DEMO</span></div>

   <div className="games">

    <button className="game g1" onClick={()=>go('roulette')}><span className="pill">LIVE</span><span className="decor">◉</span><span className="game-name">Рулетка</span></button>

    <button className="game g2" onClick={()=>go('keno')}><span className="pill">KENO</span><span className="decor">🎯</span><span className="game-name">Кено</span></button>

    <button className="game g3" onClick={()=>go('wheel')}><span className="pill">COINFLIP</span><span className="decor">🪙</span><span className="game-name">CoinFlip</span></button>

    <button className="game g4" onClick={()=>go('mines')}><span className="pill">MINES</span><span className="decor">✦</span><span className="game-name">Мины</span></button>

    <button className="game g5 wide" onClick={()=>go('ladder')}><span className="pill">RISK</span><span className="decor">⇧</span><span className="game-name">Лестница</span></button>

   </div>

   <div className="panel" style={{marginTop:14}}><div className="row"><div><h3 style={{margin:0}}>Ежедневный бонус</h3><div className="small">Забирай рубины каждый день</div></div><button className="btn" onClick={()=>go('bonus')}>Забрать</button></div></div>

   <div className="panel small">RUBIN — демонстрационный интерфейс. Баланс виртуальный, реальные платежи и выплаты не подключены.</div>

  </>}

  {page==='bonus'&&<>

   {pageHeader('Бонусы','Ежедневные награды и промокоды')}

   <div className="bonus-form" id="promo-entry">

    <h3>Активировать промокод</h3>

    <p>Введи промокод и получи виртуальные рубины на баланс.</p>

    <div className="promo-line">

     <input className="promo-input" value={promoCode} onChange={e=>setPromoCode(e.target.value.toUpperCase())} placeholder="ВВЕДИ ПРОМОКОД" maxLength={32}/>

     <button className="promo-button" onClick={()=>{

      const code=promoCode.trim().toUpperCase();

      if(!code){notify('Введите промокод в поле выше','error','Ошибка бонуса');return}

      if(usedPromos.includes(code)){notify('Этот промокод уже использован','error','Ошибка бонуса');return}

      const rewards={RUBIN5:5,RUBIN10:10,RUBIN100:100};

      if(!rewards[code]){notify('Такого промокода не существует','error','Ошибка бонуса');return}

      const reward=rewards[code];

      setBalance(v=>v+reward);setUsedPromos(v=>[...v,code]);setPromoCode('');

      record('Промокод',code,reward);notify('Промокод '+code+' активирован: +'+fmt(reward)+' ♦','bonus','Бонус получен');

     }}>Активировать</button>

    </div>

   </div>

   <div className="bonus-form">

    <div className="row">

     <div><h3>Твой ежедневный бонус</h3><p style={{marginBottom:0}}>Обычная награда — случайно от 1 до 5 ♦.</p></div>

     <div className="ruby" style={{fontSize:25,fontWeight:900,whiteSpace:'nowrap'}}>♦ 1–5</div>

    </div>

    <button className="btn" style={{width:'100%',marginTop:14}} disabled={dailyClaimed} onClick={claimDaily}>{dailyClaimed?'Бонус получен ✓':'Забрать ежедневный бонус'}</button>

   </div>

   <div className="panel small">Награды начисляются в виртуальный демо-баланс. Настоящие промокоды, ежедневный сброс и защита от повторного использования требуют серверной части.</div>

  </>}

  {page==='roulette'&&<>

   {pageHeader('Рулетка','Европейская · один ноль')}
   <div className="original-banner"><div className="eyebrow">RUBIN ORIGINALS</div><strong>Рулетка</strong><small>Европейская рулетка · один ноль</small></div>
   <RouletteGame balance={balance} setBalance={setBalance} notify={notify} record={record} onRound={()=>setRounds(v=>v+1)}/>

  </>}

  {page==='wheel'&&<>
   {pageHeader('CoinFlip','Орёл или решка · выплата ×1,9')}
   <div className="original-banner"><div className="eyebrow">RUBIN ORIGINALS</div><strong>CoinFlip</strong><small>Выбери сторону монеты и попробуй угадать результат броска.</small></div>
   <StakeControls bet={bet} setBet={setBet} balance={balance} disabled={spinning}/>
   <div className="panel">
    <div className="row"><span className="muted">Демо-баланс</span><b className="ruby">♦ {fmt(balance)}</b></div>
    <div className="coin-area"><div className={'coin-3d '+(spinning?'flip':'')}>{result||'♦'}</div><div className="empty">{spinning?'Монета подбрасывается…':result?('Результат: '+result):'Выбери орла или решку'}</div></div>
    <div className="coin-picks"><button className={coinChoice==='heads'?'sel':''} disabled={spinning} onClick={()=>setCoinChoice('heads')}>🪙 ОРЁЛ</button><button className={coinChoice==='tails'?'sel':''} disabled={spinning} onClick={()=>setCoinChoice('tails')}>💗 РЕШКА</button></div>
    <div className="empty">Верный прогноз: ×1,9 · Максимальная выплата {fmt(bet*1.9)} ♦</div>
    <button className="btn" style={{width:'100%',marginTop:8}} disabled={spinning||bet>balance} onClick={wheel}>{spinning?'Бросаем монету…':'БРОСИТЬ · '+fmt(bet)+' ♦'}</button>
   </div>
  </>}

  {page==='keno'&&<>
   {pageHeader('Кено','Выбери числа от 1 до 10 · розыгрыш 10 из 40')}
   <div className="original-banner"><div className="eyebrow">RUBIN ORIGINALS</div><strong>Кено</strong><small>Отметь от 1 до 10 чисел. Автовыбор подберёт пять случайных чисел.</small></div>
   <StakeControls bet={bet} setBet={setBet} balance={balance} disabled={spinning}/>
   <div className="panel">
    <div className="row"><b>Выбери числа</b><span className="muted">{kenoSelected.length} / 10</span></div>
    <div className="keno-grid">{Array.from({length:40},(_,i)=>i+1).map(n=><button key={n} disabled={spinning} className={'keno-number '+(kenoSelected.includes(n)?'selected ':'')+(kenoDrawn.includes(n)?'drawn':'')} onClick={()=>toggleKeno(n)}>{n}</button>)}</div>
    <div className="game-actions"><button className="btn secondary" disabled={spinning} onClick={autoKeno}>АВТОВЫБОР</button><button className="btn secondary" disabled={spinning} onClick={clearKeno}>ОЧИСТИТЬ</button></div>
    <button className="btn" style={{width:'100%',marginTop:10}} disabled={spinning||kenoSelected.length<1||bet>balance} onClick={playKeno}>{spinning?'РОЗЫГРЫШ…':'ИГРАТЬ · '+fmt(bet)+' ♦'}</button>
    {kenoLast&&<div className="notice" style={{marginTop:12}}><b>Совпадений: {kenoLast.hits}</b><br/>Выпавшие числа: {kenoLast.drawn.join(', ')}<br/>Множитель: ×{kenoLast.mult} · Выплата: {fmt(kenoLast.payout)} ♦</div>}
    <h3 style={{marginTop:18}}>Таблица выплат</h3><div className="small">Множитель применяется к ставке; неуказанные результаты дают ×0.</div>
    <table className="payout-table"><thead><tr><th>Выбрано</th><th>Совпадения → множитель</th></tr></thead><tbody>{[[1,'1: ×3,5'],[2,'1: ×1,2 · 2: ×5'],[3,'2: ×2 · 3: ×12'],[4,'2: ×1,5 · 3: ×4 · 4: ×20'],[5,'2: ×1 · 3: ×2 · 4: ×8 · 5: ×35'],[6,'2: ×0,5 · 3: ×2 · 4: ×5 · 5: ×15 · 6: ×50'],[7,'2: ×0,5 · 3: ×1,5 · 4: ×3 · 5: ×8 · 6: ×25 · 7: ×70'],[8,'3: ×1 · 4: ×2 · 5: ×5 · 6: ×15 · 7: ×40 · 8: ×100'],[9,'3: ×0,5 · 4: ×1,5 · 5: ×3 · 6: ×8 · 7: ×20 · 8: ×60 · 9: ×150'],[10,'3: ×0,5 · 4: ×1 · 5: ×2 · 6: ×5 · 7: ×12 · 8: ×35 · 9: ×90 · 10: ×250']].map(([n,desc])=><tr key={n}><td>{n}</td><td>{desc}</td></tr>)}</tbody></table>
   </div>
   <div className="panel"><h3>История результатов Кено</h3>{history.filter(h=>h.name==='Кено').length?history.filter(h=>h.name==='Кено').slice(0,10).map((h,i)=><div className="listrow" key={i}><div><b>{h.result}</b><div className="small">{h.time}</div></div><b className={h.amount>=0?'ruby':''}>{h.amount>0?'+':''}{fmt(h.amount)} ♦</b></div>):<div className="empty">Результатов пока нет</div>}</div>
  </>}

  {page==='mines'&&<>
   {pageHeader('Мины','Открывай рубины и избегай мин')}
   <div className="original-banner"><div className="eyebrow">RUBIN ORIGINALS</div><strong>Мины</strong><small>Выбери количество мин от 2 до 24. Открывай рубины и забирай выигрыш до мины.</small></div>
   <StakeControls bet={bet} setBet={setBet} balance={balance} disabled={mineStarted}/>
   <div className="panel">
    <div className="row"><b>Количество мин</b><b className="ruby">{mineCount}</b></div>
    <input type="number" min="2" max="24" step="1" inputMode="numeric" value={mineCount} disabled={mineStarted} onChange={e=>setMineCount(Math.max(2,Math.min(24,Math.floor(Number(e.target.value)||2))))} className="input" style={{marginTop:10}}/>
    <input type="range" min="2" max="24" value={mineCount} disabled={mineStarted} onChange={e=>setMineCount(+e.target.value)} style={{width:'100%',accentColor:'#e3345b',marginTop:12}}/>
    <div className="grid25">{(mineBoard.length?mineBoard:Array.from({length:25},()=>({open:false,mine:false}))).map((c,i)=><button key={i} disabled={!mineStarted||mineOver||c.open} className={'cell '+(c.open?(c.mine?'mine':'open'):'')} onClick={()=>openCell(i)}>{c.open?(c.mine?'💣':'💎'):''}</button>)}</div>
    <div className="row"><span className="muted">Безопасных клеток: {mineSafe}</span><b>{mineStarted?'×'+mineMultiplier(mineSafe,mineCount).toFixed(2):'—'}</b></div>
    <div className="empty">{mineStarted?'Каждый открытый рубин увеличивает возможную выплату.':mineOver?'Раунд завершён. Начни новую игру.':'Запусти игру, затем открывай ячейки.'}</div>
    {!mineStarted?<button className="btn" style={{width:'100%',marginTop:8}} disabled={bet>balance} onClick={startMines}>{mineOver?'НОВАЯ ИГРА':'НАЧАТЬ · '+fmt(bet)+' ♦'}</button>:<button className="btn" style={{width:'100%',marginTop:8}} disabled={!mineSafe} onClick={cashMines}>ЗАБРАТЬ · {fmt(Math.floor(bet*mineMultiplier(mineSafe,mineCount)))} ♦</button>}
   </div>
  </>}
  {page==='ladder'&&<>
   {pageHeader('Лестница','8 уровней · четыре ячейки в каждом ряду')}
   <div className="original-banner"><div className="eyebrow">RUBIN ORIGINALS</div><strong>Лестница</strong><small>На каждом уровне выбери одну из четырёх ячеек. Найди рубин и избегай мины.</small></div>
   <StakeControls bet={bet} setBet={setBet} balance={balance} disabled={ladderActive}/>
   <div className="panel">
    <b>Уровень сложности</b><div className="difficulty-row">{[['easy','Низкая'],['medium','Средняя'],['hard','Высокая']].map(([id,label])=><button key={id} className={ladderDifficulty===id?'sel':''} disabled={ladderActive} onClick={()=>setLadderDifficulty(id)}>{label}</button>)}</div>
    <div className="row"><span className="muted">Прогресс</span><b>{ladderLevel} / 8</b></div>
    <div className="ladder-board">{Array.from({length:8},(_,i)=>7-i).map(level=>{const n=level+1;return <div key={level} className={'ladder-row '+(ladderActive&&level===ladderLevel?'current':'')}><div className="ladder-meta">УРОВЕНЬ {n}<b>×{ladderMultiplier(n).toFixed(2)}</b></div><div className="ladder-cells">{[0,1,2,3].map(col=>{const chosen=ladderChoices[level]===col;const isMine=(ladderMines[level]||[]).includes(col);const reveal=ladderOver||level<ladderLevel||chosen;const cls=reveal&&chosen?(isMine?'mine':'safe'):'';const label=reveal&&isMine&&chosen?'💣':reveal&&chosen?'💎':ladderOver&&isMine?'💣':ladderActive&&level===ladderLevel?'?':'·';return <button key={col} className={cls} disabled={!ladderActive||level!==ladderLevel||chosen} onClick={()=>climb(col)}>{label}</button>})}</div></div>})}</div>
    <div className="empty">{ladderMsg||'Каждый уровень — выбор одной из четырёх ячеек.'}</div>
    {!ladderActive?<button className="btn" style={{width:'100%'}} disabled={bet>balance} onClick={startLadder}>{ladderOver?'НОВАЯ ИГРА':'НАЧАТЬ · '+fmt(bet)+' ♦'}</button>:<button className="btn" style={{width:'100%'}} disabled={!ladderLevel} onClick={cashLadder}>ЗАБРАТЬ · ×{ladderMultiplier(ladderLevel).toFixed(2)}</button>}
    <div className="small" style={{marginTop:12}}>Низкая: 1 мина на ряд. Средняя: 2 мины. Высокая: 3 мины. После проигрыша мины показываются на поле.</div>
   </div>
  </>}


  {page==='deposit'&&<>

   {pageHeader('Пополнение и вывод','Демо-баланс')}

   <div className="panel">

    <div className="empty" style={{fontSize:40,color:'#ff315b'}}>♦</div>

    <div className="balancebig ruby">{fmt(balance)} ♦</div>

    <div className="small">Текущий виртуальный баланс</div>

    <h3 style={{marginTop:20}}>Добавить демо-рубины</h3>

    <input className="input" type="number" min="1" max="100000" value={deposit} onChange={e=>setDeposit(e.target.value)}/>

    <button className="btn" style={{width:'100%',marginTop:12}} onClick={()=>{const n=Math.floor(Number(deposit));if(!n||n<1||n>100000){notify('Введите сумму от 1 до 100 000 ♦','error','Ошибка пополнения');return}setBalance(v=>v+n);record('Демо-пополнение','Начислено',n);notify('Зачислено '+fmt(n)+' ♦ на демо-баланс','deposit')}}>Начислить демо-рубины</button>

    <p className="small">Тестовая функция. Это не реальные деньги и не платёж.</p>

   </div>

   <div className="panel">

    <h3>Демо-вывод</h3>

    <input className="input" type="number" min="1" value={withdraw} onChange={e=>setWithdraw(e.target.value)} placeholder="Сумма"/>

    <button className="btn secondary" style={{width:'100%',marginTop:12}} onClick={()=>{const n=Math.floor(Number(withdraw));if(!n||n<1){notify('Введите сумму вывода от 1 ♦','error','Ошибка вывода');return}if(n>balance){notify('Недостаточно средств. На балансе '+fmt(balance)+' ♦','error','Ошибка вывода');return}setBalance(v=>v-n);record('Демо-вывод','Списано',-n);notify('Заявка на вывод '+fmt(n)+' ♦ создана (демо)','withdraw')}}>Вывести демо-рубины</button>

    <p className="small">Виртуальная операция: реальные выплаты не подключены.</p>

   </div>

  </>}

  {page==='referrals'&&<>

   {pageHeader('Друзья','Реферальная программа')}

   <div className="panel">

    <div className="eyebrow ruby">RUBIN FRIENDS</div>

    <h2 style={{fontSize:28}}>50%</h2>

    <p className="muted">Получай 50% с каждого депозита приглашённого друга и 200 ♦ за его первое пополнение от 500 ♦. В этой версии статистика демонстрационная — для реальных начислений нужен сервер.</p>

    <div className="row"><span className="muted">Приглашено друзей</span><b>0</b></div>

    <div className="row" style={{marginTop:12}}><span className="muted">Друзей пополнили от 500 ♦</span><b>0</b></div>

    <div className="row" style={{marginTop:12}}><span className="muted">Бонусы за приглашения</span><b>0 ♦</b></div>

    <div className="row" style={{marginTop:12}}><span className="muted">Доход с депозитов</span><b>0 ♦</b></div>

    <button className="btn secondary" style={{width:'100%',marginTop:18}} onClick={()=>{if(navigator.clipboard)navigator.clipboard.writeText('https://t.me/your_bot').then(()=>notify('Демо-ссылка скопирована','success')).catch(()=>notify('Замените ссылку на ссылку своего бота'));else notify('Скопируйте ссылку своего бота вручную')}}>Скопировать ссылку</button>

   </div>

  </>}

  {page==='profile'&&<>

   {pageHeader('Профиль','Настройки аккаунта')}

   <div className="usercard" style={{marginBottom:12}}>

    <div className="avatar">{user?.photo_url?<img src={user.photo_url} alt="Фото профиля"/>:'♦'}</div>

    <div className="userinfo"><div className="username">{user?.first_name||'Игрок RUBIN'}</div><div className="balance"><span className="ruby">♦</span> {fmt(balance)}</div><div className="small">{user?.username?'@'+user.username:'Демо-профиль'}</div></div>

   </div>

   <div className="panel">

    <div className="listrow"><span className="muted">Игр сыграно</span><b>{rounds}</b></div>

    <div className="listrow"><span className="muted">Записей в истории</span><b>{history.length}</b></div>

    <div className="listrow"><span className="muted">Telegram</span><b>{tg?'Подключён':'Браузер'}</b></div>

    <button className="btn secondary" style={{width:'100%',marginTop:12}} onClick={()=>{setBalance(1000);setHistory([]);setRounds(0);notify('Демо-баланс сброшен')}}>Сбросить демо-профиль</button>

   </div>

   <div className="panel"><h3>Последние события</h3>{history.length?history.map((h,i)=><div className="listrow" key={i}><div><b>{h.name}</b><div className="small">{h.time} · {h.result}</div></div><b className={h.amount>=0?'ruby':''}>{h.amount>0?'+':''}{fmt(h.amount)} ♦</b></div>):<div className="empty">Пока нет событий</div>}</div>

   <div className="panel small">В реальном Telegram Mini App сервер должен проверять подпись initData. Данные этого демо не являются защищённым аккаунтом.</div>

  </>}

  <nav className="bottomnav">{nav.map(([id,icon,label])=><button key={id} className={'navitem '+(page===id?'active':'')+(id==='deposit'?' central':'')} onClick={()=>go(id)}><span>{icon}</span>{id!=='deposit'&&<span className="navlabel">{label}</span>}</button>)}</nav>

  <Toasts items={toasts} onClose={dismiss}/>

 </div>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
